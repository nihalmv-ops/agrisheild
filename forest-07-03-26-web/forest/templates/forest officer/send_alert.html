<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Send Complaint</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
{% extends 'forest officer/officer_home.html' %}
{% block body %}
  <div class="container mt-5">
    <h4 class="mb-4">Send Alert</h4>
    <form method="post" action="/myapp/officer_sendalert_post/">
        {% csrf_token %}

      <!-- Complaint Text -->
      <div class="mb-3">
        <label for="complaint" class="form-label">Message</label>
        <textarea class="form-control" name="message" id="replay" rows="4" placeholder="Write your alert here..." required></textarea>
      </div>

          <div class="mb-3">
        <label for="complaint" class="form-label">Latitude</label>
        <input type="text" class="form-control" name="latitude" id="replay"  required>
      </div>

          <div class="mb-3">
        <label for="complaint" class="form-label">Longitude</label>
        <input type="text" class="form-control" name="longitude" id="replay" required>
      </div>

      <!-- Optional File Upload -->


      <!-- Submit Button -->
      <button type="submit" class="btn btn-primary">Send</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
</body>
</html>
