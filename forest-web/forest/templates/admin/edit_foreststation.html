<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Registration Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
  <div class="container">
    <h2 class="mb-4">edit Forest station</h2>
    <form method="post" action="/myapp/editforeststation_post/">
    {% csrf_token %}
              <input type="hidden"  value="{{ data.id }}"  name="id">

      <div class="row mb-3">
        <label for="name" class="col-sm-4 ">Name</label>
        <div class="col-sm-8">
          <input type="text"  value="{{ data.name }}"  name="name" class="form-control" id="name" required>
        </div>
      </div>



      <div class="row mb-3">
        <label for="email" class="col-sm-4 ">Email address</label>
        <div class="col-sm-8">
          <input type="email" name="email" value="{{ data.Email }}" class="form-control" id="email" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="phone" class="col-sm-4 ">Phone Number</label>
        <div class="col-sm-8">
          <input type="tel" name="phone"  pattern="[0-9]{10}" value="{{ data.phone }}" class="form-control" id="phone" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="place" class="col-sm-4 ">Place</label>
        <div class="col-sm-8">
          <input type="text" name="place" class="form-control" value="{{ data.Place }}" id="place" required>
        </div>
      </div>



<div class="row mb-3">
        <label for="place" class="col-sm-4 ">District</label>
        <div class="col-sm-8">
          <input type="text" name="district" class="form-control" value="{{ data.District }}" id="district" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="state" class="col-sm-4 ">State</label>
        <div class="col-sm-8">
          <input type="text" name="state" class="form-control"value="{{ data.State }}" id="state" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="pincode" class="col-sm-4 ">Pincode</label>
        <div class="col-sm-8">
          <input type="text" name="pincode" pattern="[0-9]{6}" class="form-control"value="{{ data.pin }}" id="pincode" required>
        </div>
      </div>
<div class="row mb-3">
        <label for="pincode" class="col-sm-4 ">Forestdivision</label>
        <div class="col-sm-8">
            <select name="division" value="{{ data.FORESTDIVISION }}">
                {% for i in data1 %}
                <option value="{{ i.id }}">{{ i.name }}-{{ i.place }}</option>
                {% endfor %}
            </select>
{#          <input type="text" name="pincode" pattern="[0-9]{6}" class="form-control"  id="pincode" required>#}
        </div>
      </div>


      <div class="row mb-3">
        <div class="offset-sm-4 col-sm-8">
          <button type="submit" class="btn btn-primary">Update</button>
        </div>
      </div>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
