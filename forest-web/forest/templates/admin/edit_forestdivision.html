<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Registration Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
{% extends 'admin/adminhome.html' %}
{% block body %}
  <div class="container">
    <h2 class="mb-4">Registration Form</h2>
    <form method="post" action="/myapp/editforestdivision_post/">
     {% csrf_token %}
        <input type="hidden" name="id" value="{{ data.id }}">
      <div class="row mb-3">
        <label for="name" class="col-sm-4 ">division Name</label>
        <div class="col-sm-8">
          <input type="text" class="form-control" id="name" value="{{ data.name }}" name="name" required>
        </div>
      </div>
        <div class="row mb-3">
        <label for="place" class="col-sm-4 ">division place</label>
        <div class="col-sm-8">
          <input type="text" class="form-control" id="place" value="{{ data.place }}" name="place" required>
        </div>
      </div>



      <div class="row mb-3">
        <div class="offset-sm-4 col-sm-8">
          <button type="submit" class="btn btn-primary">Register</button>
        </div>
      </div>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
</body>
</html>
