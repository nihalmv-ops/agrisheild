<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Registration Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
  <div class="container">
    <h2 class="mb-4">Registration Form</h2>
    <form method="post" action="/myapp/editforstofficer_post/" enctype="multipart/form-data">
    {% csrf_token %}
              <input type="hidden"  value="{{ i.id }}" name="id" >

      <div class="row mb-3">
        <label for=" name" class="col-sm-4 ">officer Name</label>
        <div class="col-sm-8">
          <input type="text" class="form-control" value="{{ i.name }}" id=" name" name="name" required>
        </div>
      </div>
         <div class="row mb-3">
        <label class="col-sm-4 ">Gender</label>
        <div class="col-sm-8">
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" {% if i.gender == 'male' %} checked {% endif %} name="gender"  value="male" id="male" required>
            <label class="form-check-label" for="male">Male</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" {% if i.gender == 'female' %} checked {% endif %}name="gender" value="female" id="female"  required>
            <label class="form-check-label" for="female">Female</label>
          </div>
        </div>
      </div>

<div class="row mb-3">
        <label for="place" class="col-sm-4 ">place</label>
        <div class="col-sm-8">
          <input type="text" class="form-control" value="{{ i.place }}" id="place" name="place" required>
        </div>
      </div>

      <div class="row mb-3">
        <label for="email" class="col-sm-4 ">Email address</label>
        <div class="col-sm-8">
          <input type="email" class="form-control" value="{{ i.email }}" id="email" name="email" required>
        </div>
      </div>

              <div class="row mb-3">
        <label for="dob" class="col-sm-4 ">Date of Birth</label>
        <div class="col-sm-8">
          <input type="date" class="form-control" value="{{ i.dob }}" id="dob"name="dob" required>
        </div>
      </div>

              <div class="row mb-3">
        <label for="photo" class="col-sm-4 "> photo</label>
        <div class="col-sm-8">
            <img src="{{i.photo}}" height="100" width="100">
          <input type="file" class="form-control" id="photo"name="photo" accept="image/*" >
        </div>
      </div>

              <div class="row mb-3">
        <label for="state" class="col-sm-4 ">State</label>
        <div class="col-sm-8">
          <input type="text" class="form-control" value="{{ i.state }}" id="state" required name="state">
        </div>
      </div>


        <div class="row mb-3">
        <label for="disrict" class="col-sm-4 ">district</label>
        <div class="col-sm-8">
          <input type="text" class="form-control" value="{{ i.district }}" id="District" required name="district">
        </div>
      </div>



        <div class="row mb-3">
        <label for="phone" class="col-sm-4 ">Phone Number</label>
        <div class="col-sm-8">
          <input type="tel" pattern="[0-9]{10}" class="form-control" value="{{ i.phone_number }}" id="phone" required name="phone">
        </div>
      </div>


         <div class="row mb-3">
        <label for="photo" class="col-sm-4 "> Forest station</label>
        <div class="col-sm-8">
            <select name="foreststation" class="form-select">
                {% for a in data %}
                <option value="{{ a.id }}" {% if a.id == i.FORESTSTATION.id %} selected{% endif %} >
                {{ a.name }}
                </option>
                {% endfor %}

            </select>
        </div>
      </div>


      <div class="row mb-3">
        <div class="offset-sm-4 col-sm-8">
          <button type="submit" class="btn btn-primary">Register</button>
        </div>
      </div>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
