<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Registration Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
{% extends 'forest officer/officer_home.html' %}
{% block body %}
  <div class="container">
    <h2 class="mb-4">Registration Form</h2>
    <form method="post">
        {% csrf_token %}
      <div class="row mb-3">
        <label for=" name" class="col-sm-4 ">officer Name</label>
        <div class="col-sm-8">{{ data.name }}</div>
      </div>

         <div class="row mb-3">
        <label class="col-sm-4 ">Gender</label>
        <div class="col-sm-8">{{ data.gender }}</div>
        </div>



              <div class="row mb-3">
        <label for="dob" class="col-sm-4 ">Date of Birth</label>
        <div class="col-sm-8">{{ data.dob }}</div>
      </div>


      <div class="row mb-3">
        <label for="email" class="col-sm-4 ">Email address</label>
        <div class="col-sm-8">{{ data.email }}</div>
      </div>



        <div class="row mb-3">
        <label for="phone" class="col-sm-4 ">Phone Number</label>
        <div class="col-sm-8">{{ data.phone_number }}</div>
      </div>




<div class="row mb-3">
        <label for="place" class="col-sm-4 ">place</label>
        <div class="col-sm-8">{{ data.place }}</div>
      </div>



        <div class="row mb-3">
        <label for="disrict" class="col-sm-4 ">district</label>
        <div class="col-sm-8">{{ data.district }}</div>
      </div>

              <div class="row mb-3">
        <label for="state" class="col-sm-4 ">State</label>
        <div class="col-sm-8">{{ data.state }}</div>
      </div>

              <div class="row mb-3">
        <label for="photo" class="col-sm-4 "> photo</label>
        <div class="col-sm-8"><img src="{{ data.photo }}"height="100" width="100"></div>
      </div>

         <div class="row mb-3">
        <label for="photo" class="col-sm-4 "> Forest station</label>
        <div class="col-sm-8">{{ data.FORESTSTATION.name }}
        </div>
      </div>


    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
</body>
</html>
